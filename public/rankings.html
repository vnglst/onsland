<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Land Use Rankings - OnsLand</title>
    <meta
      name="description"
      content="Rankings of European countries by land use categories - which countries have the most water, woodland, urban areas, and more."
    />
    <link rel="stylesheet" href="style.css" />
    <script defer data-domain="onsland.koenvangilst.nl" src="https://plausible.koenvangilst.nl/js/script.js"></script>
    <script src="i18n.js"></script>
    <script src="language-switcher.js"></script>
    <script src="menu.js"></script>
  </head>
  <body>
    <header>
      <div class="homepage-header">
        <a href="/" class="back-button">
          <span class="back-text-full"><span data-i18n="common.back">Back</span></span>
          <span class="back-text-short" data-i18n="common.backShort">←</span>
        </a>
        <h1>
          <span class="title-full" data-i18n="rankings.heading">Land Use Rankings</span>
          <span class="title-short" data-i18n="rankings.headingShort">Rankings</span>
        </h1>
        <div class="header-spacer"></div>
      </div>
    </header>

    <div class="rankings-container" id="rankingsContainer">
      <!-- Rankings will be dynamically generated here -->
    </div>

    <footer class="page-footer">
      <div class="footer-content">
        <div>
          <span data-i18n="common.data">Data</span>:
          <a target="_blank" href="https://ec.europa.eu/eurostat/databrowser/view/lan_lcv_ovw/default/table"
            >Eurostat Land Cover</a
          >
          | <span data-i18n="common.code">Code</span>: <a target="_blank" href="https://github.com/vnglst/onsland">Github</a>
        </div>
        <div>
          <span data-i18n="common.visualisationBy">Visualisation by</span> <a target="_blank" href="https://koenvangilst.nl/lab/european-land-use">Koen van Gilst</a>
        </div>
      </div>
    </footer>

    <script src="countries.js"></script>
    <script src="render.js"></script>
    <script src="translation-utils.js"></script>
    <script>
      // Initialize i18n and menu
      initI18n().then(() => {
        // Update page title and meta description
        document.title = i18n.t('rankings.title');
        document.querySelector('meta[name="description"]').setAttribute('content', i18n.t('rankings.metaDescription'));

        // Initialize menu
        initMenu();

        // Render rankings after translations are loaded
        renderRankings();

        // Listen for language changes and re-render rankings
        window.addEventListener('languageChanged', () => {
          // Update page title
          document.title = i18n.t('rankings.title');

          // Clear and re-render rankings
          const container = document.getElementById("rankingsContainer");
          container.innerHTML = '';
          renderRankings();

          // Preserve scroll to hash if present
          if (window.location.hash) {
            setTimeout(() => {
              const element = document.querySelector(window.location.hash);
              if (element) {
                element.scrollIntoView({ behavior: "smooth" });
              }
            }, 100);
          }
        });

        // Scroll to category if hash is present in URL
        if (window.location.hash) {
          setTimeout(() => {
            const element = document.querySelector(window.location.hash);
            if (element) {
              element.scrollIntoView({ behavior: "smooth" });
            }
          }, 100);
        }
      });

      // Extract all categories and their data from all countries
      function getAllCategoryRankings() {
        const categoryData = {};

        // Iterate through all countries and collect category data
        Object.keys(countryConfigs).forEach((countryKey) => {
          const config = countryConfigs[countryKey];
          const countryName = countryNames[countryKey];

          config.categories.forEach((category) => {
            if (!categoryData[category.name]) {
              categoryData[category.name] = {
                color: category.color,
                countries: [],
              };
            }

            categoryData[category.name].countries.push({
              countryKey: countryKey,
              countryName: countryName,
              percentage: category.percentage,
            });
          });
        });

        // Sort countries within each category by percentage (descending)
        Object.keys(categoryData).forEach((categoryName) => {
          categoryData[categoryName].countries.sort((a, b) => b.percentage - a.percentage);
        });

        return categoryData;
      }

      function createCategorySlug(categoryName) {
        return categoryName.toLowerCase().replace(/[^a-z0-9]+/g, "-");
      }

      function renderRankings() {
        const categoryRankings = getAllCategoryRankings();
        const container = document.getElementById("rankingsContainer");

        // Sort categories by name for consistent display
        const sortedCategories = Object.keys(categoryRankings).sort();

        sortedCategories.forEach((categoryName) => {
          const data = categoryRankings[categoryName];

          // Skip categories with 3 or fewer countries
          if (data.countries.length <= 3) {
            return;
          }
          const categorySlug = createCategorySlug(categoryName);

          // Find the maximum percentage for this category (for bar scaling)
          const maxPercentage = data.countries[0]?.percentage || 0;

          const section = document.createElement("div");
          section.className = "category-ranking";
          section.id = categorySlug;

          const heading = document.createElement("h2");
          const colorBox = document.createElement("span");
          colorBox.className = "category-color-box";
          colorBox.style.backgroundColor = data.color;
          heading.appendChild(colorBox);
          heading.appendChild(document.createTextNode(translateCategory(categoryName)));
          section.appendChild(heading);

          const list = document.createElement("ol");
          list.className = "ranking-list";

          data.countries.forEach((country, index) => {
            const item = document.createElement("li");
            item.className = "ranking-item";

            const position = document.createElement("span");
            position.className = "ranking-position";
            position.textContent = `${index + 1}.`;
            item.appendChild(position);

            const countryName = document.createElement("span");
            countryName.className = "ranking-country";
            const link = document.createElement("a");
            link.href = `country?country=${country.countryKey}`;
            link.textContent = i18n.t(`countries.${country.countryKey}`) || country.countryName;
            countryName.appendChild(link);
            item.appendChild(countryName);

            const percentage = document.createElement("span");
            percentage.className = "ranking-percentage";
            percentage.textContent = `${(country.percentage * 100).toFixed(2)}%`;
            item.appendChild(percentage);

            const bar = document.createElement("div");
            bar.className = "ranking-bar";
            const barFill = document.createElement("div");
            barFill.className = "ranking-bar-fill";
            barFill.style.backgroundColor = data.color;
            barFill.style.width = `${(country.percentage / maxPercentage) * 100}%`;
            bar.appendChild(barFill);
            item.appendChild(bar);

            list.appendChild(item);
          });

          section.appendChild(list);
          container.appendChild(section);
        });
      }
    </script>
  </body>
</html>
