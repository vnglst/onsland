<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="pageTitle">Land Use - OnsLand</title>
    <meta name="description" content="Interactive visualization of land use showing agriculture, nature, urban areas, and more." id="pageDescription">
    <link rel="stylesheet" href="style.css" />
    <script defer data-domain="onsland.koenvangilst.nl" src="https://plausible.koenvangilst.nl/js/script.js"></script>
    <script src="lib/d3.v7.min.js"></script>
    <script src="lib/d3-hexbin.v0.2.min.js"></script>
    <script src="lib/topojson-client.v3.min.js"></script>
  </head>
  <body>
    <header>
      <div id="countryHeader">
        <button class="back-button" id="backButton">
          <span class="back-text-full">← Back to Overview</span>
          <span class="back-text-short">←</span>
        </button>
        <h1 id="countryTitle">
          <span class="title-prefix">Land Use in </span>
          <span class="title-country"></span>
        </h1>
        <button class="toggle-button" id="layoutToggle">
          <span class="toggle-text-full">Square View</span>
          <span class="toggle-text-short">Square</span>
        </button>
      </div>
    </header>
    <svg id="countrySvg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid"></svg>
    <footer>
      <div class="footer-content">
        <span>Data: <a target="_blank" href="https://ec.europa.eu/eurostat/databrowser/view/lan_lcv_ovw/default/table">Eurostat Land Cover</a></span>
        <span class="footer-separator">|</span>
        <span>Code: <a target="_blank" href="https://github.com/vnglst/onsland">Github</a></span>
        <button class="download-button" id="downloadButton">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 11L4 7h2.5V2h3v5H12L8 11z" fill="currentColor"/>
            <path d="M14 14H2v-2h12v2z" fill="currentColor"/>
          </svg>
          <span>Download PNG</span>
        </button>
      </div>
      <div class="footer-creator">
        Visualisation by <a target="_blank" href="https://koenvangilst.nl/labs/ons-land">Koen van Gilst</a>
      </div>
    </footer>
    <script src="countries.js"></script>
    <script src="render.js"></script>
    <script>
      const DEV_MODE = true;

      const urlParams = new URLSearchParams(window.location.search);
      const countryFromUrl = urlParams.get("country");
      const currentCountry = validCountries.includes(countryFromUrl) ? countryFromUrl : "netherlands";

      document.getElementById("pageTitle").textContent = `Land Use in ${countryNames[currentCountry]} - OnsLand`;
      document.querySelector(".title-country").textContent = countryNames[currentCountry];

      let worldData = null;
      let isSquareLayout = false;
      let hexDataGlobal = null;
      let hexColorsGlobal = null;

      fetch("lib/countries-50m.json")
        .then((response) => response.json())
        .then((world) => {
          worldData = world;
          renderCountry(currentCountry);
        })
        .catch((error) => console.error("Error loading data:", error));

      document.getElementById("backButton").addEventListener("click", () => {
        window.location.href = "index.html";
      });

      document.getElementById("layoutToggle").addEventListener("click", () => {
        isSquareLayout = !isSquareLayout;
        const fullText = isSquareLayout ? "Map View" : "Square View";
        const shortText = isSquareLayout ? "Map" : "Square";
        document.querySelector(".toggle-text-full").textContent = fullText;
        document.querySelector(".toggle-text-short").textContent = shortText;
        toggleLayout();
      });

      function renderCountry(countryKey) {
        if (!worldData) return;

        const config = countryConfigs[countryKey];
        const categories = config.categories;
        const labels = config.labels;

        const svg = d3.select("#countrySvg");
        svg.selectAll("*").remove();

        const width = 800;
        const height = 800;
        const hexRadius = 6;

        const projection = d3
          .geoMercator()
          .center(config.center)
          .scale(config.scale)
          .translate([width / 2, height / 2]);

        const path = d3.geoPath().projection(projection);

        const countries = topojson.feature(worldData, worldData.objects.countries);
        const countryFeature = countries.features.find((d) => d.id === config.isoCode);

        if (!countryFeature) {
          console.error(`Country ${countryKey} not found in dataset`);
          return;
        }

        const hexbin = d3
          .hexbin()
          .radius(hexRadius)
          .extent([
            [0, 0],
            [width, height],
          ]);

        const hexCenters = [];
        for (let y = hexRadius; y < height; y += hexRadius * 1.5) {
          for (let x = hexRadius; x < width; x += hexRadius * Math.sqrt(3)) {
            hexCenters.push([x, y]);
          }
        }

        const hexPoints = hexCenters.filter((center) => d3.geoContains(countryFeature, projection.invert(center)));
        const hexData = hexbin(hexPoints);
        hexDataGlobal = hexData;

        const totalHexagons = hexData.length;

        const colorScale = d3
          .scaleOrdinal()
          .domain(categories.map((c) => c.name))
          .range(categories.map((c) => c.color));

        let hexColors = [];
        let remainingHexagons = totalHexagons;

        categories.forEach((category, index) => {
          let hexagonsPerCategory;
          if (index === categories.length - 1) {
            hexagonsPerCategory = remainingHexagons;
          } else {
            hexagonsPerCategory = Math.round(totalHexagons * category.percentage);
            remainingHexagons -= hexagonsPerCategory;
          }
          for (let i = 0; i < hexagonsPerCategory; i++) {
            hexColors.push(category.name);
          }
        });

        hexColorsGlobal = hexColors;

        let selectedCategory = null;

        function highlightHexagons(category) {
          svg
            .selectAll(".hexagon")
            .filter((_, i) => hexColors[i] === category)
            .classed("highlight", true);
          svg
            .selectAll(".legend-item")
            .filter((_, i) => categories[i].name !== category)
            .classed("dimmed", true);
          svg
            .selectAll(".legend-item")
            .filter((_, i) => categories[i].name === category)
            .classed("dimmed", false);
        }

        function deselectHexagons() {
          svg.selectAll(".hexagon").classed("highlight", false);
          svg.selectAll(".legend-item").classed("dimmed", false);
          selectedCategory = null;
        }

        svg
          .append("g")
          .selectAll("path")
          .data(hexData)
          .enter()
          .append("path")
          .attr("class", "hexagon")
          .attr("d", (d) => hexbin.hexagon(0))
          .attr("transform", (d) => `translate(${d.x},${d.y - Math.random() * 200})`)
          .attr("fill", "var(--bg-light)")
          .on("mouseenter", function (event, d) {
            const category = hexColors[hexData.indexOf(d)];
            highlightHexagons(category);
          })
          .on("mouseleave", function (event, d) {
            if (!selectedCategory) {
              deselectHexagons();
            }
          })
          .on("click", function (event, d) {
            const category = hexColors[hexData.indexOf(d)];
            if (selectedCategory === category) {
              deselectHexagons();
            } else {
              deselectHexagons();
              highlightHexagons(category);
              selectedCategory = category;
            }
            event.stopPropagation();
            event.preventDefault();
          })
          .transition()
          .delay((d, i) => i * 0.7)
          .duration(750)
          .ease(d3.easeCubicOut)
          .attr("fill", (d, i) => colorScale(hexColors[i]))
          .attr("transform", (d) => `translate(${d.x},${d.y})`)
          .attr("d", (d) => hexbin.hexagon(hexRadius));

        d3.select("body").on("click", function () {
          if (selectedCategory !== null) {
            deselectHexagons();
          }
        });

        const legendPosition = config.legendPosition || "top";
        let legendY = 5;
        if (legendPosition === "bottom") {
          legendY = height - categories.length * 20 - 120;
        }

        const legend = svg.append("g").attr("transform", `translate(5, ${legendY})`);

        categories.forEach((category, i) => {
          const legendItem = legend
            .append("g")
            .attr("transform", `translate(0, ${i * 20})`)
            .attr("class", `legend-item ${category.name.replace(/\s+/g, "-")}`);

          legendItem
            .append("path")
            .attr("d", hexbin.hexagon(hexRadius))
            .attr("transform", "translate(5,5)")
            .style("fill", category.color)
            .attr("opacity", 0)
            .transition()
            .delay(i * 40)
            .duration(500)
            .attr("opacity", 1);

          legendItem
            .append("text")
            .attr("x", 20)
            .attr("y", 10)
            .text(`${category.name}, ${(category.percentage * 100).toFixed(2)}%`)
            .attr("font-size", "14px")
            .attr("fill", "var(--text-light)")
            .attr("opacity", 0)
            .transition()
            .delay(i * 40)
            .duration(500)
            .attr("opacity", 1);
        });

        labels
          .filter((c) => c.displayLabel)
          .forEach((category, i) => {
            const labelGroup = svg;

            const labelText = labelGroup
              .append("text")
              .attr("x", category.labelPosition.x)
              .attr("y", category.labelPosition.y)
              .text(category.label)
              .attr("font-size", "18px")
              .attr("fill", "var(--text-light)")
              .attr("font-weight", "bold")
              .attr("opacity", 0)
              .attr("data-label", category.label)
              .attr("data-type", "position");

            const line = labelGroup
              .append("line")
              .attr("x1", category.labelPosition.x - 10)
              .attr("y1", category.labelPosition.y - 5)
              .attr("x2", category.labelTarget.x - 10)
              .attr("y2", category.labelTarget.y - 5)
              .attr("stroke", "var(--text-light)")
              .attr("stroke-width", 2)
              .attr("stroke-dasharray", "2,2")
              .attr("opacity", 0)
              .attr("data-label", category.label);

            line
              .transition()
              .delay(totalHexagons * 0.7 + 750 + i * 300)
              .duration(500)
              .attr("opacity", 1);

            const targetCircle = labelGroup
              .append("circle")
              .attr("cx", category.labelTarget.x - 10)
              .attr("cy", category.labelTarget.y - 5)
              .attr("r", 5)
              .attr("fill", "var(--text-light)")
              .attr("opacity", 0)
              .attr("data-label", category.label)
              .attr("data-type", "target");

            targetCircle
              .transition()
              .delay(totalHexagons * 0.7 + 750 + i * 300)
              .duration(500)
              .attr("opacity", 1);

            const positionCircle = labelGroup
              .append("circle")
              .attr("cx", category.labelPosition.x - 10)
              .attr("cy", category.labelPosition.y - 5)
              .attr("r", 5)
              .attr("fill", "var(--text-light)")
              .attr("opacity", 0)
              .attr("data-label", category.label)
              .attr("data-type", "position");

            positionCircle
              .transition()
              .delay(totalHexagons * 0.7 + 750 + i * 300)
              .duration(500)
              .attr("opacity", 1);

            if (DEV_MODE) {
              const dragPosition = d3
                .drag()
                .on("drag", function (event) {
                  const label = d3.select(this).attr("data-label");
                  const newX = event.x;
                  const newY = event.y;

                  svg
                    .selectAll(`circle[data-label="${label}"][data-type="position"]`)
                    .attr("cx", newX - 10)
                    .attr("cy", newY - 5);

                  svg.selectAll(`text[data-label="${label}"]`).attr("x", newX).attr("y", newY);

                  svg
                    .selectAll(`line[data-label="${label}"]`)
                    .attr("x1", newX - 10)
                    .attr("y1", newY - 5);
                })
                .on("end", function () {
                  printLabelCoordinates();
                });

              const dragTarget = d3
                .drag()
                .on("drag", function (event) {
                  const label = d3.select(this).attr("data-label");
                  const newX = event.x;
                  const newY = event.y;

                  svg
                    .selectAll(`circle[data-label="${label}"][data-type="target"]`)
                    .attr("cx", newX - 10)
                    .attr("cy", newY - 5);

                  svg
                    .selectAll(`line[data-label="${label}"]`)
                    .attr("x2", newX - 10)
                    .attr("y2", newY - 5);
                })
                .on("end", function () {
                  printLabelCoordinates();
                });

              labelText.attr("cursor", "move").call(dragPosition);
              positionCircle.attr("cursor", "move").call(dragPosition);
              targetCircle.attr("cursor", "move").call(dragTarget);
            }

            labelText
              .transition()
              .delay(totalHexagons * 0.7 + 750 + i * 300)
              .duration(500)
              .attr("opacity", 1);
          });

        function printLabelCoordinates() {
          const coordinates = [];

          labels.forEach((label) => {
            const textEl = svg.select(`text[data-label="${label.label}"]`);
            const targetEl = svg.select(`circle[data-label="${label.label}"][data-type="target"]`);

            if (!textEl.empty() && !targetEl.empty()) {
              const posX = parseFloat(textEl.attr("x"));
              const posY = parseFloat(textEl.attr("y"));
              const targetX = parseFloat(targetEl.attr("cx")) + 10;
              const targetY = parseFloat(targetEl.attr("cy")) + 5;

              coordinates.push({
                label: label.label,
                displayLabel: true,
                labelTarget: { x: Math.round(targetX), y: Math.round(targetY) },
                labelPosition: { x: Math.round(posX), y: Math.round(posY) },
              });
            }
          });

          console.log(`\n=== ${countryKey} Label Coordinates (JSON) ===`);
          console.log(JSON.stringify(coordinates, null, 2));
          console.log("===============================================\n");
        }

        // Add creator name at bottom of SVG (small text)
        svg
          .append("text")
          .attr("x", width / 2)
          .attr("y", height - 10)
          .attr("text-anchor", "middle")
          .attr("font-size", "10px")
          .attr("fill", "var(--text-light)")
          .attr("opacity", 0.5)
          .text("Koen van Gilst");

      }

      function toggleLayout() {
        const svg = d3.select("#countrySvg");
        const hexRadius = 6;
        const squareSize = 10;

        if (isSquareLayout) {
          const squarePositions = calculateSquarePositions(hexDataGlobal.length);

          svg
            .selectAll(".hexagon")
            .transition()
            .duration(1000)
            .ease(d3.easeCubicInOut)
            .attr("transform", (d, i) => {
              const pos = squarePositions[i];
              return `translate(${pos.x},${pos.y})`;
            })
            .attr("d", squarePath(squareSize))
            .attr("stroke-width", 0);

          svg
            .selectAll("text[data-label], line[data-label], circle[data-label]")
            .transition()
            .duration(500)
            .attr("opacity", 0);
        } else {
          const hexbin = d3.hexbin().radius(hexRadius);

          svg
            .selectAll(".hexagon")
            .transition()
            .duration(1000)
            .ease(d3.easeCubicInOut)
            .attr("transform", (d, i) => `translate(${hexDataGlobal[i].x},${hexDataGlobal[i].y})`)
            .attr("d", hexbin.hexagon(hexRadius))
            .attr("stroke-width", 0.1);

          svg
            .selectAll("text[data-label], line[data-label], circle[data-label]")
            .transition()
            .delay(500)
            .duration(500)
            .attr("opacity", 1);
        }
      }

      // Download SVG as PNG functionality
      document.getElementById("downloadButton").addEventListener("click", () => {
        const svgElement = document.getElementById("countrySvg");

        // Clone the SVG to avoid modifying the original
        const svgClone = svgElement.cloneNode(true);

        // Get computed CSS variable values
        const rootStyles = getComputedStyle(document.documentElement);
        const bgDark = rootStyles.getPropertyValue('--bg-dark').trim();
        const textLight = rootStyles.getPropertyValue('--text-light').trim();
        const bgLight = rootStyles.getPropertyValue('--bg-light').trim();

        // Replace all CSS variables with actual color values in the clone
        svgClone.querySelectorAll('*').forEach(el => {
          const fill = el.getAttribute('fill');
          const stroke = el.getAttribute('stroke');

          if (fill && fill.includes('var(')) {
            if (fill.includes('--text-light')) el.setAttribute('fill', textLight);
            if (fill.includes('--bg-light')) el.setAttribute('fill', bgLight);
            if (fill.includes('--bg-dark')) el.setAttribute('fill', bgDark);
          }

          if (stroke && stroke.includes('var(')) {
            if (stroke.includes('--bg-light')) el.setAttribute('stroke', bgLight);
          }
        });

        // Serialize the modified SVG
        const svgData = new XMLSerializer().serializeToString(svgClone);

        // Create blob and object URL
        const svgBlob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
        const url = URL.createObjectURL(svgBlob);

        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement("canvas");
          canvas.width = 1600; // 2x resolution for better quality
          canvas.height = 1600;

          const ctx = canvas.getContext("2d");

          // Fill with background color
          ctx.fillStyle = bgDark;
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          // Draw the SVG image
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          URL.revokeObjectURL(url);

          // Convert canvas to PNG and download
          canvas.toBlob((blob) => {
            const pngUrl = URL.createObjectURL(blob);
            const downloadLink = document.createElement("a");
            const fileName = `onsland-${currentCountry}-${Date.now()}.png`;
            downloadLink.href = pngUrl;
            downloadLink.download = fileName;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
            URL.revokeObjectURL(pngUrl);
          });
        };

        img.onerror = function(error) {
          console.error("Error loading SVG for download:", error);
          alert("Error generating PNG. Please try again.");
        };

        img.src = url;
      });
    </script>
  </body>
</html>
