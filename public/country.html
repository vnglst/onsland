<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="pageTitle">Land Use - OnsLand</title>
    <meta
      name="description"
      content="Interactive visualization of land use showing agriculture, nature, urban areas, and more."
      id="pageDescription"
    />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#000000" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://onsland.koenvangilst.nl" />
    <meta property="og:title" content="OnsLand - Land Use In Europe" />
    <meta
      property="og:description"
      content="Interactive visualization of land use showing agriculture, nature, urban areas, and more."
    />
    <meta property="og:image" content="https://onsland.koenvangilst.nl/assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://onsland.koenvangilst.nl" />
    <meta name="twitter:title" content="OnsLand - Land Use In Europe" />
    <meta
      name="twitter:description"
      content="Interactive visualization of land use showing agriculture, nature, urban areas, and more."
    />
    <meta name="twitter:image" content="https://onsland.koenvangilst.nl/assets/twitter-image.png" />

    <!-- Fonts -->
    <link rel="stylesheet" href="fonts/ibm-plex-sans.css" />

    <link rel="stylesheet" href="shared/base.css" />
    <link rel="stylesheet" href="shared/menu.css" />
    <link rel="stylesheet" href="shared/language-switcher.css" />
    <link rel="stylesheet" href="country.css" />
    <script
      defer
      data-domain="onsland.koenvangilst.nl"
      src="https://plausible.koenvangilst.nl/js/script.js"
    ></script>
    <script src="vendor/d3.v7.min.js"></script>
    <script src="vendor/d3-hexbin.v0.2.min.js"></script>
    <script src="vendor/topojson-client.v3.min.js"></script>
    <script src="shared/i18n.js"></script>
    <script src="shared/language-switcher.js"></script>
    <script src="shared/menu.js"></script>
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div id="countryHeader">
          <a href="/" class="back-button">
            <span class="back-text-full"><span data-i18n="common.back">Back</span></span>
            <span class="back-text-short" data-i18n="common.backShort">←</span>
          </a>
          <h1 id="countryTitle">
            <span class="title-prefix" data-i18n="country.titlePrefix">Land Use in </span>
            <span class="title-country"></span>
          </h1>
          <!-- Hamburger menu will be added here by menu.js -->
        </div>
      </nav>
    </header>

    <svg id="countrySvg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid"></svg>

    <div id="rankingsInfo" class="rankings-info">
      <!-- Rankings information will be dynamically inserted here -->
    </div>

    <footer class="page-footer">
      <div class="footer-content">
        <div>
          <span data-i18n="common.data">Data</span>:
          <a
            target="_blank"
            href="https://ec.europa.eu/eurostat/databrowser/view/lan_lcv_ovw/default/table"
            >Eurostat Land Cover</a
          >
          | <span data-i18n="common.code">Code</span>:
          <a target="_blank" href="https://github.com/vnglst/onsland">Github</a>
        </div>
        <div>
          <span data-i18n="common.visualisationBy">Visualisation by</span>
          <a target="_blank" href="https://koenvangilst.nl/lab/european-land-use">Koen van Gilst</a>
        </div>
      </div>
    </footer>

    <script src="shared/countries.js"></script>
    <script src="shared/render.js"></script>
    <script src="shared/translation-utils.js"></script>
    <script src="shared/page-init.js"></script>
    <script src="country.js"></script>
  </body>
</html>
