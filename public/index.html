<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OnsLand - Land Use In Europe</title>
    <meta name="description" content="Interactive visualization comparing land use across European countries. Explore how different nations utilize their land for agriculture, nature, urban areas, and more.">
    <link rel="canonical" href="https:/onsland.koenvangilst.nl" />
    <link rel="stylesheet" href="style.css" />
    <script defer data-domain="onsland.koenvangilst.nl" src="https://plausible.koenvangilst.nl/js/script.js"></script>
    <script src="lib/d3.v7.min.js"></script>
    <script src="lib/d3-hexbin.v0.2.min.js"></script>
    <script src="lib/topojson-client.v3.min.js"></script>
  </head>
  <body>
    <header>
      <h1>Land Use in Europe</h1>
    </header>
    <div id="homepage" class="homepage-grid"></div>
    <script src="countries.js"></script>
    <script src="render.js"></script>
    <script>
      let worldData = null;

      // Load world data once
      fetch("lib/countries-50m.json")
        .then((response) => response.json())
        .then((world) => {
          worldData = world;
          showHomepage();
        })
        .catch((error) => console.error("Error loading data:", error));

      function showHomepage() {
        const homepage = document.getElementById("homepage");
        homepage.innerHTML = "";

        // Create all cards with loading placeholders first to prevent layout shift
        validCountries.forEach((countryKey) => {
          const countryCard = document.createElement("div");
          countryCard.className = "country-card loading";
          countryCard.setAttribute("data-country", countryKey);

          const title = document.createElement("div");
          title.className = "country-card-title";
          title.textContent = countryNames[countryKey];

          const placeholder = document.createElement("div");
          placeholder.className = "loading-placeholder";

          const loadingText = document.createElement("div");
          loadingText.className = "loading-text";
          loadingText.textContent = "Loading...";

          countryCard.appendChild(title);
          countryCard.appendChild(placeholder);
          countryCard.appendChild(loadingText);
          homepage.appendChild(countryCard);
        });

        // Render countries progressively
        validCountries.forEach((countryKey, index) => {
          // Stagger rendering to avoid blocking the UI
          setTimeout(() => {
            const countryCard = homepage.querySelector(`[data-country="${countryKey}"]`);
            if (!countryCard) return;

            // Remove loading state
            countryCard.classList.remove("loading");
            const placeholder = countryCard.querySelector(".loading-placeholder");
            const loadingText = countryCard.querySelector(".loading-text");
            if (placeholder) placeholder.remove();
            if (loadingText) loadingText.remove();

            // Create SVG
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("viewBox", "0 0 800 800");
            svg.setAttribute("preserveAspectRatio", "xMidYMid");
            svg.classList.add("country-preview");

            countryCard.appendChild(svg);

            // Add click handler - navigate to country page
            countryCard.onclick = () => {
              window.location.href = `country.html?country=${countryKey}`;
            };

            // Render the country
            renderCountryPreview(countryKey, svg, worldData);
          }, index * 50); // Stagger by 50ms
        });
      }
    </script>
  </body>
</html>
