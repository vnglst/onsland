<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OnsLand - Land Use In Europe</title>
    <meta name="description" content="Interactive visualization comparing land use across European countries. Explore how different nations utilize their land for agriculture, nature, urban areas, and more.">
    <link rel="canonical" href="https:/onsland.koenvangilst.nl" />
    <link rel="stylesheet" href="style.css" />
    <script defer data-domain="onsland.koenvangilst.nl" src="https://plausible.koenvangilst.nl/js/script.js"></script>
    <!-- D3 and visualization libraries -->
    <script src="lib/d3.v7.min.js"></script>
    <script src="lib/d3-hexbin.v0.2.min.js"></script>

    <!-- Legacy scripts needed by Preact components -->
    <script src="countries.js"></script>
    <script src="render.js"></script>
    <script src="page-init.js"></script>

  <body>
    <header>
      <div class="homepage-header">
        <h1>
          <span class="title-full">Land Use in Europe</span>
          <span class="title-short">Europe</span>

        <div><span>Visualisation by</span> <a target="_blank" href="https://koenvangilst.nl/lab/european-land-use">Koen van Gilst</a></div>

    <script type="module" src="/src/main-home.jsx"></script>
