<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I18n Test</title>
    <script src="i18n.js"></script>
    <script src="language-switcher.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .debug { background: #f0f0f0; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>I18n Debug Test</h1>

    <div class="debug">
        <strong>Current Language:</strong> <span id="currentLang"></span>
    </div>

    <div>
        <h2 data-i18n="common.back">Back</h2>
        <p data-i18n="common.data">Data</p>
    </div>

    <div id="languageSwitcher"></div>

    <div class="debug">
        <h3>Debug Log:</h3>
        <div id="debugLog"></div>
    </div>

    <script>
        function log(message) {
            const logDiv = document.getElementById('debugLog');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `<div>[${timestamp}] ${message}</div>`;
            console.log(message);
        }

        log('Starting initialization...');

        initI18n().then(() => {
            log('initI18n completed');
            log('Current language: ' + i18n.currentLanguage);
            document.getElementById('currentLang').textContent = i18n.currentLanguage;

            // Create language switcher
            const switcher = document.createElement('select');
            switcher.className = 'language-switcher';

            i18n.getAvailableLanguages().forEach(lang => {
                const option = document.createElement('option');
                option.value = lang.code;
                option.textContent = lang.name;
                if (lang.code === i18n.currentLanguage) {
                    option.selected = true;
                }
                switcher.appendChild(option);
            });

            switcher.addEventListener('change', async (e) => {
                log('Language change requested: ' + e.target.value);
                await i18n.changeLanguage(e.target.value);
                log('changeLanguage completed');
                document.getElementById('currentLang').textContent = i18n.currentLanguage;
            });

            document.getElementById('languageSwitcher').appendChild(switcher);

            // Listen for language changed event
            window.addEventListener('languageChanged', (e) => {
                log('languageChanged event fired: ' + e.detail.language);
            });

            log('Setup complete');
        }).catch(error => {
            log('Error: ' + error.message);
        });
    </script>
</body>
</html>
