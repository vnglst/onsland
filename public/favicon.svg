<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="hexGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:hsl(51, 100%, 65%);stop-opacity:1" />
      <stop offset="50%" style="stop-color:hsl(159, 27%, 53%);stop-opacity:1" />
      <stop offset="100%" style="stop-color:hsl(210, 58%, 71%);stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="100" height="100" fill="#000"/>

  <!-- Hexagon shape -->
  <path d="M 50 10 L 85 30 L 85 70 L 50 90 L 15 70 L 15 30 Z"
        fill="url(#hexGradient)"
        stroke="hsl(51, 100%, 75%)"
        stroke-width="2"/>

  <!-- Inner detail hexagons -->
  <path d="M 50 25 L 70 37 L 70 63 L 50 75 L 30 63 L 30 37 Z"
        fill="none"
        stroke="hsl(51, 100%, 85%)"
        stroke-width="1.5"
        opacity="0.6"/>
</svg>
